title: Nova
author: Raphael Teixeira
version: 0.2.0
quarto-required: ">=1.5.0"
contributes:
  formats:
    revealjs:
      # Tema: papel levemente quente, títulos serifados em azul UFPA,
      # área útil máxima.
      theme: [nova.scss]
      highlight-style: nova.theme
      lang: pt-BR
      filters: [nova.lua]
      # Canvas 16:9. margin: 0 => o slide ocupa a tela toda; as bordas
      # internas (estreitas) são controladas no CSS (padding das <section>).
      width: 1600
      height: 900
      margin: 0
      center: false
      # Transições suaves: fade entre slides, morph em auto-animate.
      transition: fade
      transition-speed: default
      background-transition: fade
      auto-animate-easing: "cubic-bezier(0.22, 1, 0.36, 1)"
      auto-animate-duration: 0.8
      # Elementos de interface discretos
      footer: "UFPA · [Prof. Dr. Raphael Teixeira](https://raphateixeira.github.io)"
      slide-number: c
      controls: false
      progress: true
      hash: true
      preview-links: auto
      code-copy: true
      menu:
        side: left
      include-in-header: nova-header.html
      include-after-body: [nova-after.html, nova-extras.html]
